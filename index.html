<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMG Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="panel">
        <h1>EMG Generator</h1>

        <button id="toggleState" type="button" aria-pressed="false">
            Switch to active
        </button>

        <div class="status-row">
            <span class="label">State:</span>
            <strong id="stateLabel">Resting</strong>
        </div>

        <div class="status-row">
            <span class="label">Current value:</span>
            <strong id="valueLabel">0.00</strong>
        </div>

        <section class="graph-section" aria-labelledby="graphTitle">
            <div class="graph-heading">
                <h2 id="graphTitle">Signal over time</h2>
                <span>Last 10 seconds</span>
            </div>
            <canvas id="signalGraph" role="img" aria-label="Live EMG signal graph, from 0 to 12 units over the last 10 seconds"></canvas>
        </section>
        <div class="stickman-container" aria-hidden="true">
    <svg viewBox="0 0 100 120" width="80" height="96">
        <!-- Resting pose (visible when isActive = false) -->
        <g id="restingPose" stroke="#56d6b0" stroke-width="3" fill="none" stroke-linecap="round">
            <circle cx="50" cy="20" r="8" fill="#56d6b0"/>
            <line x1="50" y1="28" x2="50" y2="70"/>
            <line x1="50" y1="40" x2="30" y2="55"/>
            <line x1="50" y1="40" x2="70" y2="55"/>
            <line x1="50" y1="70" x2="35" y2="100"/>
            <line x1="50" y1="70" x2="65" y2="100"/>
        </g>
        
        <!-- Active pose (visible when isActive = true) -->
        <g id="activePose" stroke="#f6b94b" stroke-width="3" fill="none" stroke-linecap="round" style="display: none;">
            <circle cx="50" cy="20" r="8" fill="#f6b94b"/>
            <line x1="50" y1="28" x2="50" y2="70"/>
            <line x1="50" y1="40" x2="20" y2="45"/>
            <line x1="50" y1="40" x2="80" y2="45"/>
            <line x1="50" y1="70" x2="35" y2="100"/>
            <line x1="50" y1="70" x2="65" y2="100"/>
            <!-- Wall -->
            <line x1="85" y1="30" x2="85" y2="90" stroke="#9ca3af" stroke-width="4"/>
        </g>
    </svg>
</div>
    </main>








    <script src="script.js"></script>
</body>
</html>
